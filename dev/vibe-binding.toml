# Values for the slots this archetype declares. The text after the marker is
# the archetype's own description of the slot, verbatim — it is the
# authoritative statement of what the value must be. A list renders as a
# human-joined set of backticked names; a string renders as prose.
[dispatch.vars]
end_to_end_modules = [
  "tests/testthat/test-e2e-pipeline.R",
  "tests/testthat/test-e2e-corpus.R",
  "tests/testthat/test-ingest.R",
]

# A PROJECTION over a closed set, computed from the tree at build time and
# inlined as a table. Permitted here only because this archetype's finding is
# a claim over a set, which is unsound unless the set is closed. The question
# is never "what members exist" but "which test modules consume each member", so the
# column below is the answer and the member names alone would not be.
[dispatch.manifest]
set = "tests/testthat/fixtures/*/*"
label = "The closed set, and which test modules consume each member"
why = "a member that no end-to-end module exercises has never been through the real path; the member names alone would not answer that"
cap = 40

[[dispatch.manifest.column]]
name = "which test modules consume each member"
search = "tests/testthat/*.R"
kind = "referenced-in"


