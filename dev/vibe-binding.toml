# -------------------------------------------------------------------------
# Sandbox construction. vibe-prepare.py copies the working tree once per dispatch
# (each dispatch needs its own workdir — they all write findings.jsonl).
[sandbox]
# ANSWER-KEY EXCLUSION. dev/tdd-run/ is this skill's own run ledger — audit deltas,
# the fresh-eyes review, the parked findings — and a reviewer that can read it is
# transcribing rather than reviewing: it scores beautifully and measures nothing.
# That directory is excluded by the tooling itself; `dev` is excluded here because
# the rest of it is usually working notes of the same kind.
#
# NOW ANSWER THE QUESTION THIS LINE CANNOT ANSWER FOR YOU: what ELSE in this tree
# tells a reviewer what it is supposed to find? Design notes naming known defects, a
# TODO list, a scratch review, an issue export, a CHANGELOG that describes the bug
# being hunted, a sibling worktree. Only this project knows. Add each to the list.
# NOT `["dev"]` — the plan gate's own subjects live in dev/plans/, and a subject the
# sandbox does not contain fails the brief outright. So this excludes the answer keys
# INSIDE dev/ by name, and keeps the specification itself readable (the gate card:
# "a spec recording adjudicated decisions is still the spec, and the reviewer is meant
# to read it"). dev/tdd-run/ is excluded by the tooling regardless.
#
# What each entry is an answer key FOR:
#   CODE-REVIEW-2026-07-19.md + -TRIAGE.md  the literal finding list (F6-F19, T-1, T-2)
#                                           that PLAN-12 exists to remediate. A reviewer
#                                           holding these transcribes rather than reviews.
#   HANDOVER.md                             a "Loose ends / known issues" section naming
#                                           the open defects outright.
#   PLAN-CHANGE-REQUESTS.md                 the append-only ambiguity log from the
#                                           test-writing phase — every known soft spot.
#   PARKED-QUESTIONS.md                     the resolved-question log, same shape.
#   tdd-skill-improvements.md               names the anti-patterns this run is hunting.
#
# ENTRIES ARE BASENAMES, NOT PATHS. copy_tree()'s ignore matches `n in skip` against
# each NAME at every depth, so "dev/HANDOVER.md" silently excludes NOTHING (verified:
# the answer keys were still in the sandbox). Every basename below is unique in this
# tree, which is what makes basename-matching safe here.
exclude = [
  "CODE-REVIEW-2026-07-19.md",
  "CODE-REVIEW-2026-07-19-TRIAGE.md",
  "HANDOVER.md",
  "tdd-skill-improvements.md",
  "PLAN-CHANGE-REQUESTS.md",
  "PARKED-QUESTIONS.md",
]

# Optional: a shell command run inside each sandbox after the copy, before the
# review. The case that motivated it: an editable install whose .pth file still
# names the REAL source directory, so every sandbox imports the live repo and every
# probe measures the wrong code — silently, with a green suite. Delete this comment
# if the project has no such fixup.
