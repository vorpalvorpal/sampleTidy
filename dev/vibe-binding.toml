# A vibe-reviewer BINDING — the project half of the brief. GENERATED, THEN FINISHED BY HAND.
#
# Generated by scripts/vibe-scaffold-binding.py from
#   dev/tdd-run/manifest.toml
# Everything in here that could be derived mechanically has been. Everything else is marked:
#
#     TODO(vibe-binding): <what is wanted>
#
# THOSE MARKERS ARE NOT OPTIONAL AND THIS FILE DOES NOT WORK UNTIL THEY ARE GONE.
#
# YOU DO NOT HAVE TO EDIT THIS FILE TO REMOVE THEM. The command that generated it printed
# every hole with its key path and the argument that answers it; answer all of them at once:
#
#     python3 ~/.claude/skills/tdd-plan/scripts/vibe-scaffold-binding.py \
#         --binding dev/vibe-binding.toml \
#         --fill '<key path>=<value>' --fill ...
#
# That substitutes in place and leaves every comment here intact. A value containing a comma
# becomes a TOML array (`subjects`, `end_to_end_modules`, a spec's `keys`); write `\,` for a
# comma that is part of prose. A key path that does not exist, or one that has already been
# answered, is refused by name rather than quietly written — the one exception being a
# projection column's `.pattern` or `.search`, which is added, because which of the two a
# column needs is a consequence of the `kind` you are answering in the same command.
#
# The instruction in each hole IS the specification for that value — in a [dispatch.vars]
# slot it is the archetype's own description of what the slot means, copied verbatim, and it
# is the most authoritative statement of it that exists.
#
# Two backstops, neither of which should ever fire on a binding filled that way:
#   - `vibe-scaffold-binding.py --check dev/vibe-binding.toml` lists anything
#     outstanding and exits 1.
#   - vibe-brief.py refuses to render at all, naming every offending key path.
#
# They are deliberate rather than defensive. An unfilled slot does not produce a visibly
# broken brief; it produces a well-formed brief pointing somewhere adjacent to what was
# intended, and the reviewer returns a confident, well-formatted report about the wrong
# thing. Nothing downstream catches that.
#
# THE SPLIT
# ---------
# scripts/vibe-archetypes.toml holds the task SHAPES: what reasoning each task demands, its
# procedure, its stopping criterion, its worked NO_ISSUES record, and a declaration of what
# KINDS of input the shape needs. It names no project, no file, no language, no tool. THIS
# file supplies the addresses. Neither renders alone. scripts/bindings/stellwerk.toml is the
# worked example and documents every field in full.
#
# FORMAT (short form; the worked example is the long form)
# ------
#   [project]  id, identity (a noun phrase completing "You are reviewing the implementation
#              of ___", no verb, no full stop), environment (what is installed, what may be
#              run, what must not be modified).
#   [[dispatch]]  one brief. id, archetype, gate, subjects (inlined COMPLETE with real line
#              numbers), optional focus / task_note / environment override,
#              [[dispatch.spec]] excerpts, [dispatch.vars] for the archetype's declared
#              slots, [dispatch.manifest] ONLY where the archetype declares one.
#
# One dispatch per archetype was generated, one per gate. Add more by copying a block and
# pointing it at another archetype id — `vibe-brief.py --list` prints the library.

[project]
# Derived from the run manifest's [meta].project.
id = "sampleTidy"

# ONE noun phrase. It is substituted into the situation paragraph of every brief as
# "You are reviewing the implementation of <<project>>", so it carries no verb and
# no full stop. Name what the thing IS, in the terms its own documentation uses:
# language, form, and what it produces. The reviewer has no other source for this.
identity = "**sampleTidy**, an R package that ingests environmental-monitoring lab data — ALS ESdat EDD files, ALS crosstab exports and human-edited ACIRL field workbooks — into an existing DuckDB monitoring database"

# The default environment paragraph for every dispatch: what is installed and may be
# run, what the reviewer is allowed to execute, and what must not be modified. A
# dispatch may override it. A reviewer that does not know it may run the suite will
# reason about the code instead of executing it, and reasoning is where fabrication
# comes from.
environment = "R >= 4.2 with `devtools`, `testthat` 3e and `duckdb` installed. Run the whole suite with `Rscript -e 'devtools::load_all(); testthat::test_dir(\"tests/testthat\")'`, and a single file with `testthat::test_file(<path>)`. IMPORTANT: the suite is DELIBERATELY RED right now — the test DDL in tests/testthat/helper-db.R is ahead of the production code, so roughly 44 failures reading `Table \"s\" does not have a column named \"uuid_feature\"` are EXPECTED and are not findings. Do not modify any source, test or fixture file."


# =========================================================================
# PLAN GATE
# =========================================================================

[[dispatch]]
id = "plan-unowned-obligations"
archetype = "plan-unowned-obligations"
gate = "plan"
# Inlined COMPLETE into the brief, each line carrying its real line number.
# Derived from the run manifest; add or remove paths as the review needs.
subjects = [
  "dev/plans/PLAN-11-feature-alias.md",
  "dev/plans/PLAN-12-review-remediation.md",
  "dev/plans/PLAN-13-alias-migration.md",
  "dev/plans/PLAN-14-registry-remediation.md",
]

# The rule text the subjects are accountable to. The document is derived from
# the manifest's [meta].digest; the span is not. Wanted: the specification whose decisions are the obligations.
[[dispatch.spec]]
# NOT the full CONTRACT.md: its A-log runs A1-A71, but A1-A47 are the adjudications of
# plans 01-10, which are landed and are NOT subjects of this stage. Feeding them would
# manufacture an "unowned obligation" for each. This derived slice is A48 onward.
# It also keeps the brief under vibe-brief.py's 180000-byte ceiling (the full CONTRACT
# plus all four plans measured 202269 bytes and was refused).
file = "dev/plans/CONTRACT-STAGE-OBLIGATIONS.md"
keys = ["Adjudicated decisions"]

# A PROJECTION over a closed set, computed from the tree at build time and
# inlined as a table. Permitted here only because this archetype's finding is
# a claim over a set, which is unsound unless the set is closed. The question
# is never "what members exist" but "which specification decisions each plan claims", so the
# column below is the answer and the member names alone would not be.
[dispatch.manifest]
set = "dev/plans/PLAN-1[1-4]*.md"
label = "The closed set, and which specification decisions each plan claims"
why = "a decision absent from every row is owned by nobody — that is the finding, readable off the table without opening anything"
cap = 40

[[dispatch.manifest.column]]
name = "which specification decisions each plan claims"
# Deliberately comma-free: `{1,2}` would be split into a TOML array by the
# scaffold's --fill comma rule and then handed to re.findall as a list.
pattern = "\\bA[0-9][0-9]?\\b"
kind = "all-matches"


